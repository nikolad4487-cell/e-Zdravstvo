name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: pnpm run test:db
      - run: pnpm run test:clinical
      - run: pnpm run test:workflows
      - run: pnpm run test:laboratory
      - run: pnpm run test:priority
      - run: pnpm run test:lab-booking
      - run: pnpm run test:lab-windows
      - run: pnpm run test:care-pathways
      - run: pnpm run test:lab-worklist
      - run: pnpm run test:cezih-lab
      - run: pnpm run test:email
      - run: pnpm run test:catalogs
      - run: pnpm run test:hzzo
      - run: pnpm run test:prescription-catalog
      - run: pnpm run test:document-email
      - run: pnpm run test:patients
      - run: pnpm run test:migrations
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
  local-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALLOW_DISPOSABLE_LOCAL_TESTS: "true"
      SUPABASE_INTERNAL_IMAGE_REGISTRY: docker.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Serve private document endpoint
        run: supabase functions serve document-files > /tmp/document-files.log 2>&1 &
      - run: pnpm run test:backend:local
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e:live
      - name: Stop disposable backend
        if: always()
        run: supabase stop --no-backup
